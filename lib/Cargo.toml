[package]
name = "wgpu_android"
version = "0.1.0"
authors = ["msiglreith <m.siglreith@gmail.com>", "Andra Antariksa <andra.antariksa@gmail.com>"]
edition = "2018"
resolver = "2"

[lib]
name = "wgpu_android_lib"
crate-type = ["cdylib"]
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wgpu = "30.0.0"
winit = "0.30.13"
pollster = "1.0.1"
log = "0.4.33"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.30.13", features = ["android-game-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30.13"

[package.metadata.android]
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
target_sdk_version = 29
min_sdk_version = 23
